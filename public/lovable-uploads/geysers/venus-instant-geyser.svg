<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="600" height="720">
  <defs>
    <linearGradient id="instantBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="copperDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Drop Shadow & Main Body -->
  <rect x="75" y="30" width="150" height="260" rx="36" fill="url(#instantBody)" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Top Accent Bar -->
  <path d="M77 66 C77 46 92 32 112 32 L188 32 C208 32 223 46 223 66 Z" fill="#0EA5E9" fill-opacity="0.08"/>

  <!-- Brand Name -->
  <text x="150" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="3">VENUS</text>
  <text x="150" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1.5">INSTANT 3000W</text>

  <!-- Center Decorative Indicator Ring -->
  <circle cx="150" cy="165" r="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="150" cy="165" r="38" fill="url(#copperDial)" fill-opacity="0.1" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Heating Flame Icon Graphic -->
  <path d="M150 142 C150 142 162 155 162 167 C162 174 157 180 150 180 C143 180 138 174 138 167 C138 155 150 142 150 142 Z" fill="url(#copperDial)"/>
  <path d="M150 154 C150 154 156 161 156 167 C156 170 153 173 150 173 C147 173 144 170 144 167 C144 161 150 154 150 154 Z" fill="#FEF3C7"/>

  <!-- Status LED Indicators -->
  <circle cx="130" cy="235" r="5" fill="#10B981"/>
  <text x="130" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle">POWER</text>

  <circle cx="170" cy="235" r="5" fill="#EF4444"/>
  <text x="170" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle">HEATING</text>

  <!-- Bottom Pipes / Inlet & Outlet Valves -->
  <rect x="110" y="290" width="16" height="35" rx="3" fill="#94A3B8"/>
  <rect x="108" y="325" width="20" height="6" rx="2" fill="#3B82F6"/>
  <circle cx="118" cy="310" r="4" fill="#3B82F6"/>

  <rect x="174" y="290" width="16" height="35" rx="3" fill="#94A3B8"/>
  <rect x="172" y="325" width="20" height="6" rx="2" fill="#EF4444"/>
  <circle cx="182" cy="310" r="4" fill="#EF4444"/>
</svg>
